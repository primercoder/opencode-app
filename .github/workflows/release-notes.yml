name: Update release notes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v0.1.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0 \
            --repo "${{ github.repository }}" \
            --notes-file RELEASE_NOTES.md
          cp RELEASE_NOTES.md /tmp/RELEASE.txt
          gh release upload v0.1.0 /tmp/RELEASE.txt \
            --repo "${{ github.repository }}" \
            --clobber
