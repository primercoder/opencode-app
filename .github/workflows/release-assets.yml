name: Publish release assets

on:
  push:
    tags:
      - "v0.1.0-assets"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release assets
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            --repo "${{ github.repository }}" \
            --title "OC Remote 0.1.0" \
            --notes-file dist/RELEASE.txt \
            dist/ocremote-0.1.0-android-arm64-v8a.apk \
            dist/ocremote-0.1.0-android-x86_64.apk \
            dist/ocremote-host-0.1.0-linux-x64.tar.gz \
            dist/ocremote-relay-0.2.0-linux-amd64 \
            dist/ocremote-relay-0.2.0-linux-amd64.tar.gz \
            dist/ocremote-relay-0.2.0-linux-arm64 \
            dist/ocremote-relay-0.2.0-linux-arm64.tar.gz \
            dist/SHA256SUMS \
            dist/RELEASE.txt
