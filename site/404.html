<!doctype html>
<html lang="zh-CN" data-type="software" data-radius="soft">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 — OC Remote</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBFBFB" />
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem("ocremote-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.add("js");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "dark" ? "#0F1013" : "#FBFBFB";
      })();
    </script>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <main class="page-hero">
      <div class="wrap">
        <p class="eyebrow"><span class="dot"></span>404</p>
        <h1>这个页面不存在。</h1>
        <p class="lede">链接可能已经移动，或者地址拼错了。</p>
        <div class="hero-actions">
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换到深色模式" title="Toggle light and dark theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" /></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg></button>
          <a class="btn btn-primary" href="index.html">回到首页</a>
          <a class="btn btn-outline" href="en/index.html">English</a>
        </div>
      </div>
    </main>
  </body>
</html>
